name: Build DSH for Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'

    steps:
    - name: Checkout DSH Source
      uses: actions/checkout@v4
      with:
        repository: deepseek-ai/deepseek-harness
        fetch-depth: 0
    - name: Checkout dsh-builder (scripts + patches)
      uses: actions/checkout@v4
      with:
        repository: x2v0/dsh-builder
        path: builder
        fetch-depth: 1


    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Patch flock for Android
      run: |
        python3 builder/scripts/patch_flock_ts.py

    - name: Install Dependencies
      run: |
        npm install -g pnpm
        # NOTE: drop --frozen-lockfile and set the target platform so pnpm
        # resolves android-arm64 variants of optional native packages
        # (koffi, esbuild, rolldown, lightningcss, ...). The DSH lockfile
        # has no android options, so frozen is not possible here.
        pnpm install --no-frozen-lockfile --config.supportedArchitectures='{"os":["android"],"cpu":["arm64"]}'

    - name: Install Android-native build tools
      run: |
        python3 builder/scripts/install_android_build_tools.py


    - name: Build DSH
      run: |
        pnpm run build:lib:host
        pnpm run build:lib:client
        pnpm run build:web
        pnpm run build:native-system
    - name: Apply Android patches
      run: |
        bash builder/scripts/apply_patches.sh

    - name: Patch FiberState for Android
      run: |
        python3 builder/scripts/patch_fiberstate.py

    - name: Patch flock.c for Android (flock -> fcntl)
      run: |
        python3 builder/scripts/patch_flock_c.py

    - name: Patch flock.js path for Android (bin/bionic)
      run: |
        python3 builder/scripts/patch_flock_path_android.py

    - name: Patch session-persistence rename import for Android
      run: |
        python3 builder/scripts/patch_session_persistence.py

    - name: Build system.node for Android
      run: |
        python3 builder/scripts/build_system_node.py

    - name: Build require_builtin.node for Android
      run: |
        python3 builder/scripts/build_require_builtin.py

    - name: Package Artifact
      run: |
        set -e
        mkdir -p dist-artifact
        echo "=== Что собралось ==="
        ls -la
        ls -la dist 2>/dev/null || echo "NO dist/"
        echo "=== Копируем ==="
        cp package.json dist-artifact/
        cp tsconfig.base.json dist-artifact/ 2>/dev/null || true
        cp pnpm-workspace.yaml dist-artifact/ 2>/dev/null || true
        cp -r dist dist-artifact/ 2>/dev/null || true
        cp -r bin dist-artifact/ 2>/dev/null || true
        cp -a packages dist-artifact/
        cp -r apps dist-artifact/ 2>/dev/null || true
        cp -r native dist-artifact/ 2>/dev/null || true
        cp -r vendor dist-artifact/ 2>/dev/null || true
        cp -a node_modules dist-artifact/
        cp -r .esbuild-android dist-artifact/ 2>/dev/null || true
        echo "=== Что в dist-artifact ==="
        ls -la dist-artifact/
        tar --hard-dereference -czvf dsh-android-arm64.tar.gz dist-artifact/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dsh-android-arm64
        path: dsh-android-arm64.tar.gz
