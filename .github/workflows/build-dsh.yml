name: Build DSH for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout DSH Source
      uses: actions/checkout@v4
      with:
        repository: deepseek-ai/deepseek-harness
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Patch flock for Android
      run: |
        python3 - << 'PYEOF'
        import os

        file_path = 'native/system/packages/entry/src/flock.ts'

        with open(file_path, 'r') as f:
            content = f.read()

        old_str = "if (platform !== 'linux' && platform !== 'darwin') {"
        new_str = "if (platform !== 'linux' && platform !== 'darwin' && platform !== 'android') {"

        if old_str in content:
            content = content.replace(old_str, new_str)
            with open(file_path, 'w') as f:
                f.write(content)
            print("[+] Патч применен успешно.")
        else:
            print("[-] Не нашел строку для патча.")
            exit(1)
        PYEOF

    - name: Install Dependencies
      run: |
        npm install -g pnpm
        pnpm install --frozen-lockfile

    - name: Build DSH
      run: |
        pnpm run build:lib:host
        pnpm run build:native-system

    - name: Package Artifact
      run: |
        set -e
        mkdir -p dist-artifact
        echo "=== Что собралось ==="
        ls -la
        ls -la dist 2>/dev/null || echo "NO dist/"
        echo "=== Копируем ==="
        cp package.json dist-artifact/
        cp pnpm-workspace.yaml dist-artifact/ 2>/dev/null || true
        cp -r dist dist-artifact/ 2>/dev/null || true
        cp -r bin dist-artifact/ 2>/dev/null || true
        cp -r packages dist-artifact/ 2>/dev/null || true
        cp -r apps dist-artifact/ 2>/dev/null || true
        cp -r native dist-artifact/ 2>/dev/null || true
        cp -r node_modules dist-artifact/ 2>/dev/null || true
        echo "=== Что в dist-artifact ==="
        ls -la dist-artifact/
        tar -czvf dsh-android-arm64.tar.gz dist-artifact/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dsh-android-arm64
        path: dsh-android-arm64.tar.gz
